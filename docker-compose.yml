services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  place-service:
    build: ./place-service
    ports:
      - "8001:8000"
    environment:
      PLACES_DATA: /srv/data/raw_places.csv

  stage-service:
    build: ./stage-service
    ports:
      - "8002:8000"

  schedule-service:
    build: ./schedule-service
    ports:
      - "8003:8000"
    environment:
      # Service-to-service URLs use Docker Compose's internal DNS (service name
      # as hostname) and the container's own port 8000, not the host-mapped ports above.
      PLACE_SERVICE_URL: http://place-service:8000
      STAGE_SERVICE_URL: http://stage-service:8000
    depends_on:
      - place-service
      - stage-service

